name: Deploy to FTP

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate FTP settings
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          FTP_PASS: ${{ secrets.FTP_PASS }}
          FTP_SERVER_DIR: ${{ secrets.FTP_SERVER_DIR }}
          FTP_TARGET_DIR: ${{ secrets.FTP_TARGET_DIR }}
        run: |
          server="${FTP_SERVER:-$FTP_HOST}"
          username="${FTP_USERNAME:-$FTP_USER}"
          password="${FTP_PASSWORD:-$FTP_PASS}"
          server_dir="${FTP_SERVER_DIR:-$FTP_TARGET_DIR}"

          missing=0
          for key in server username password server_dir; do
            if [ -z "${!key}" ]; then
              echo "::error::$key is missing. Configure FTP_SERVER/FTP_HOST, FTP_USERNAME/FTP_USER, FTP_PASSWORD/FTP_PASS and FTP_SERVER_DIR/FTP_TARGET_DIR in repository or organization secrets."
              missing=1
            fi
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Deploy repository to FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER || secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME || secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD || secrets.FTP_PASS }}
          server-dir: ${{ secrets.FTP_SERVER_DIR || secrets.FTP_TARGET_DIR }}
          protocol: ftp
          port: 21
          local-dir: ./
          state-name: .ftp-deploy-sync-state-v2.json
          exclude: |
            **/.git*
            **/.git*/**
            **/.github/**
            README.md
